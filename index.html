<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hand Light</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;width:100%;height:100%}
video{display:none}
#modeSelectWrap{position:fixed;top:14px;left:14px;z-index:50}
#modeSelect{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:14px;color:#fff;background:rgba(20,20,20,.55);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:8px 12px;outline:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);appearance:none;-webkit-appearance:none;cursor:pointer}
#modeSelect option{color:#000}
</style>
</head>
<body>
<video id="cam" playsinline></video>
<div id="modeSelectWrap">
<select id="modeSelect">
<option value="A">モード A</option>
<option value="B">モード B（全身）</option>
<option value="C">モード C（色反転）</option>
</select>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
var MAX_HANDS=6;
var MAX_PARTS=3000;
var MIRROR=true;
var CAM_BG=true;
var SKELETON=false;
var BG_ALPHA=.5;
var LIFE_DECAY=14;
var SHRINK=.94;
var COLORS=[[80,200,255],[255,110,200],[255,210,60],[120,255,140],[190,120,255],[255,140,60]];
var TIPS=[4,8,12,16,20];
var BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
let handData=null;
let camVideo;
let parts=[];
let gestureFlags={};
let audioUnlocked=false;
const ye=new Audio('ye.mp3');
let currentMode='A';

const CLAP_DISTANCE=.145;
const CLAP_ARM_DISTANCE=.23;
const CLAP_COOLDOWN=650;
const CLAP_MIN_CLOSING=.004;
let clapCooldown=0;
let previousPalmDistance=null;
let palmDistanceSmooth=null;
let clapArmed=true;
const CLAP_COLORS=[[255,40,30],[255,120,10],[255,230,50]];

const SAMPLE_COLS=72;
const SAMPLE_ROWS=48;
let sampleCanvas,sampleCtx;
let bBgAvg=null;
let bOcc=null;
let bDots=null;
let bInitialized=false;
const B_BG_RATE=.02;
const B_DIFF_THRESH=14;
const B_DIFF_RANGE=60;
const B_PUSH_GAIN=2.4;
const B_SPRING=.06;
const B_DAMPING=.82;
const B_MAX_OFFSET=46;

let cQuad=null;
let cQuadSmooth=null;

function initBState(){
  const n=SAMPLE_COLS*SAMPLE_ROWS;
  bBgAvg=new Float32Array(n);
  bOcc=new Float32Array(n);
  bDots=new Array(n);
  for(let k=0;k<n;k++)bDots[k]={ox:0,oy:0,vx:0,vy:0};
  bInitialized=false;
}

function resetBState(){
  bInitialized=false;
  if(bDots){
    for(let k=0;k<bDots.length;k++){
      bDots[k].ox=0;
      bDots[k].oy=0;
      bDots[k].vx=0;
      bDots[k].vy=0;
    }
  }
}

function setupModeSelect(){
  const sel=document.getElementById('modeSelect');
  sel.value=currentMode;
  sel.addEventListener('change',()=>{
    currentMode=sel.value;
    parts=[];
    gestureFlags={};
    clapCooldown=0;
    previousPalmDistance=null;
    palmDistanceSmooth=null;
    clapArmed=true;
    cQuad=null;
    cQuadSmooth=null;
    resetBState();
  });
}

function onHandsResult(res){
  handData=res;
}

async function initCamera(){
  camVideo=document.getElementById('cam');
  const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({maxNumHands:MAX_HANDS,modelComplexity:1,minDetectionConfidence:.4,minTrackingConfidence:.4});
    hands.onResults(onHandsResult);
    const cam=new Camera(camVideo,{onFrame:async()=>{await hands.send({image:camVideo})},width:1920,height:1080});
    await cam.start();
  }

  const sketch=p=>{
    p.setup=function(){
      const c=p.createCanvas(p.windowWidth,p.windowHeight);
      c.style('position','fixed');
      c.style('top','0');
      c.style('left','0');
      c.style('z-index','1');
      p.pixelDensity(1);
      p.background(0);
      sampleCanvas=document.createElement('canvas');
      sampleCanvas.width=SAMPLE_COLS;
      sampleCanvas.height=SAMPLE_ROWS;
      sampleCtx=sampleCanvas.getContext('2d',{willReadFrequently:true});
      initBState();
      setupModeSelect();
    };
    p.mousePressed=()=>{
      if(!audioUnlocked){
        ye.play().then(()=>{
          ye.pause();
          ye.currentTime=0;
          audioUnlocked=true;
        }).catch(()=>{});
      }
    };
    p.windowResized=()=>p.resizeCanvas(p.windowWidth,p.windowHeight);
    p.draw=()=>{
      if(currentMode==='C'){
        drawModeC(p);
        return;
      }
      if(currentMode==='B'){
        drawModeB(p);
        return;
      }
      drawModeA(p);
    };
  };
  new p5(sketch);
  initCamera();

  function drawModeA(p){
    p.noStroke();
    p.fill(0,0,0,255);
    p.rect(0,0,p.width,p.height);
    if(CAM_BG)drawCam(p);
    if(handData&&handData.multiHandLandmarks){
      const list=handData.multiHandLandmarks;
      detectClap(p,list);
      for(let h=0;h<list.length;h++){
        const lm=list[h];
        const col=COLORS[h%COLORS.length];
        let px=0,py=0;
        const palmIdx=[0,5,9,13,17];
        for(let k=0;k<palmIdx.length;k++){
          px+=lm[palmIdx[k]].x;
          py+=lm[palmIdx[k]].y;
        }
        px/=palmIdx.length;
        py/=palmIdx.length;
        spawnParticles(p,{x:px,y:py},col,2);
        for(let t=0;t<TIPS.length;t++)spawnParticles(p,lm[TIPS[t]],col,3);
        if(SKELETON)drawBones(p,lm,col);
        const middleUp=isMiddleFingerGesture(lm);
        if(middleUp&&!gestureFlags[h])fireMiddleFingerBlast(p,lm,col);
        gestureFlags[h]=middleUp;
      }
    }
    drawParticles(p);
  }

  function detectClap(p,list){
    const now=performance.now();

    if(list.length<2){
      previousPalmDistance=null;
      palmDistanceSmooth=null;
      clapArmed=true;
      return;
    }

    const a=getPalmCenter(list[0]);
    const b=getPalmCenter(list[1]);
    const dx=a.x-b.x;
    const dy=a.y-b.y;
    const rawDistance=Math.hypot(dx,dy);

    /* MediaPipeのフレームごとの揺れを吸収する */
    if(palmDistanceSmooth===null){
      palmDistanceSmooth=rawDistance;
    }else{
      palmDistanceSmooth+=(rawDistance-palmDistanceSmooth)*.45;
    }

    const distance=palmDistanceSmooth;

    /* 一度十分離れた状態を作ってから、近づいてきた時だけ「拍手」とする */
    if(distance>CLAP_ARM_DISTANCE){
      clapArmed=true;
    }

    const approaching=
    previousPalmDistance!==null &&
    distance<previousPalmDistance-CLAP_MIN_CLOSING;

    if(
    now>=clapCooldown &&
    clapArmed &&
    distance<CLAP_DISTANCE &&
    approaching
    ){
      fireClapExplosion(p,{
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
      });
      clapCooldown=now+CLAP_COOLDOWN;
      clapArmed=false;
    }

    previousPalmDistance=distance;
  }

  function getPalmCenter(lm){
    const ids=[0,5,9,13,17];
    let x=0,y=0;
    for(let i=0;i<ids.length;i++){
      x+=lm[ids[i]].x;
      y+=lm[ids[i]].y;
    }
    return{x:x/ids.length,y:y/ids.length};
  }

  function fireClapExplosion(p,pt){
    const pos=project(p,pt);
    if(audioUnlocked){
      ye.currentTime=0;
      ye.play().catch(()=>{});
    }
    for(let i=0;i<180;i++){
      const ang=p.random(p.TWO_PI);
      const speed=p.random(3,32);
      const col=CLAP_COLORS[Math.floor(p.random(CLAP_COLORS.length))];
      parts.push({
        x:pos.x+p.random(-8,8),
        y:pos.y+p.random(-8,8),
        vx:Math.cos(ang)*speed,
        vy:Math.sin(ang)*speed,
        life:255,
        size:p.random(8,28),
        col:col
      });
    }
    for(let i=0;i<30;i++){
      const ang=p.random(p.TWO_PI);
      const speed=p.random(5,22);
      parts.push({
        x:pos.x,
        y:pos.y,
        vx:Math.cos(ang)*speed,
        vy:Math.sin(ang)*speed,
        life:255,
        size:p.random(15,35),
        col:[255,255,255]
      });
    }
  }

  function drawModeB(p){
    p.noStroke();
    p.fill(0,0,0,255);
    p.rect(0,0,p.width,p.height);
    if(!camVideo||camVideo.readyState<2||!camVideo.videoWidth)return;
    sampleCtx.save();
    if(MIRROR){
      sampleCtx.translate(SAMPLE_COLS,0);
      sampleCtx.scale(-1,1);
    }
    try{
      sampleCtx.drawImage(camVideo,0,0,SAMPLE_COLS,SAMPLE_ROWS);
    }catch(e){
      sampleCtx.restore();
      return;
    }
    sampleCtx.restore();
    let data;
    try{
      data=sampleCtx.getImageData(0,0,SAMPLE_COLS,SAMPLE_ROWS).data;
    }catch(e){return}
    const cols=SAMPLE_COLS;
    const rows=SAMPLE_ROWS;
    const cellW=p.width/cols;
    const cellH=p.height/rows;
    for(let idx=0,j=0;j<rows;j++){
      for(let i=0;i<cols;i++,idx++){
        const o=idx*4;
        const lum=(data[o]+data[o+1]+data[o+2])/3;
        if(!bInitialized)bBgAvg[idx]=lum;
        else bBgAvg[idx]+=(lum-bBgAvg[idx])*B_BG_RATE;
        const diff=Math.abs(lum-bBgAvg[idx]);
        let occ=(diff-B_DIFF_THRESH)/B_DIFF_RANGE;
        if(occ<0)occ=0;
        if(occ>1)occ=1;
        bOcc[idx]=occ;
      }
    }
    bInitialized=true;
    for(let j=0;j<rows;j++){
      for(let i=0;i<cols;i++){
        const idx=j*cols+i;
        const dot=bDots[idx];
        let fx=0,fy=0;
        if(i>0&&i<cols-1)fx=-(bOcc[idx+1]-bOcc[idx-1])*.5;
        if(j>0&&j<rows-1)fy=-(bOcc[idx+cols]-bOcc[idx-cols])*.5;
        const occHere=bOcc[idx];
        const push=B_PUSH_GAIN*(.3+occHere);
        dot.vx+=fx*push*cellW;
        dot.vy+=fy*push*cellH;
        dot.vx+=-dot.ox*B_SPRING;
        dot.vy+=-dot.oy*B_SPRING;
        dot.vx*=B_DAMPING;
        dot.vy*=B_DAMPING;
        dot.ox+=dot.vx;
        dot.oy+=dot.vy;
        dot.ox=Math.max(-B_MAX_OFFSET,Math.min(B_MAX_OFFSET,dot.ox));
        dot.oy=Math.max(-B_MAX_OFFSET,Math.min(B_MAX_OFFSET,dot.oy));
      }
    }
    p.noStroke();
    const baseR=Math.max(cellW,cellH)*.95;
    for(let j=0;j<rows;j++){
      for(let i=0;i<cols;i++){
        const idx=j*cols+i;
        const o=idx*4;
        const r=data[o],g=data[o+1],b=data[o+2];
        const dot=bDots[idx];
        const hx=i*cellW+cellW/2;
        const hy=j*cellH+cellH/2;
        const x=hx+dot.ox;
        const y=hy+dot.oy;
        const occHere=bOcc[idx];
        const rad=baseR*(.7+occHere*.5);
        p.fill(r,g,b,235);
        p.circle(x,y,rad);
      }
    }
  }

  function drawModeC(p){
    p.noStroke();
    p.background(0);
    if(!camVideo||camVideo.readyState<2)return;
    drawCam(p);
    const quad=getCQuad(p);
    if(!quad)return;
    drawInvertedQuad(p,quad);
    drawQuadFrame(p,quad);
  }

  function getCQuad(p){
    if(!handData||!handData.multiHandLandmarks||handData.multiHandLandmarks.length<2){
      cQuad=null;
      cQuadSmooth=null;
      return null;
    }
    const hands=handData.multiHandLandmarks;
    const points=[];
    for(let h=0;h<Math.min(2,hands.length);h++){
      const lm=hands[h];
      points.push(project(p,lm[4]));
      points.push(project(p,lm[8]));
    }
    if(points.length!==4)return null;
    const hull=convexHull(points);
    if(hull.length!==4)return null;
    if(!cQuadSmooth){
      cQuadSmooth=hull.map(q=>({x:q.x,y:q.y}));
    }else{
      cQuadSmooth=matchQuadPoints(cQuadSmooth,hull);
      for(let i=0;i<4;i++){
        cQuadSmooth[i].x+=(hull[i].x-cQuadSmooth[i].x)*.68;
        cQuadSmooth[i].y+=(hull[i].y-cQuadSmooth[i].y)*.68;
      }
    }
    cQuad=cQuadSmooth;
    return cQuad;
  }

  function convexHull(points){
    const pts=points.slice().sort((a,b)=>a.x===b.x?a.y-b.y:a.x-b.x);
    if(pts.length<=1)return pts;
    const cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
    const lower=[];
    for(let i=0;i<pts.length;i++){
      while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],pts[i])<=0)lower.pop();
      lower.push(pts[i]);
    }
    const upper=[];
    for(let i=pts.length-1;i>=0;i--){
      while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],pts[i])<=0)upper.pop();
      upper.push(pts[i]);
    }
    lower.pop();
    upper.pop();
    return lower.concat(upper);
  }

  function matchQuadPoints(oldPts,newPts){
    if(oldPts.length!==4)return newPts;
    let best=null;
    let bestScore=Infinity;
    const perms=[
    [0,1,2,3],[0,3,2,1],[1,0,3,2],[1,2,3,0],
    [2,1,0,3],[2,3,0,1],[3,0,1,2],[3,2,1,0]
    ];
    for(let k=0;k<perms.length;k++){
      let score=0;
      for(let i=0;i<4;i++){
        const a=oldPts[i];
        const b=newPts[perms[k][i]];
        score+=(a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y);
      }
      if(score<bestScore){
        bestScore=score;
        best=perms[k];
      }
    }
    return best.map(i=>({x:newPts[i].x,y:newPts[i].y}));
  }

  function drawInvertedQuad(p,q){
    const ctx=p.drawingContext;
    const vw=camVideo.videoWidth;
    const vh=camVideo.videoHeight;
    const s=Math.max(p.width/vw,p.height/vh);
    const dw=vw*s;
    const dh=vh*s;
    const dx=(p.width-dw)/2;
    const dy=(p.height-dh)/2;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(q[0].x,q[0].y);
    ctx.lineTo(q[1].x,q[1].y);
    ctx.lineTo(q[2].x,q[2].y);
    ctx.lineTo(q[3].x,q[3].y);
    ctx.closePath();
    ctx.clip();
    ctx.filter='invert(1)';
    if(MIRROR){
      ctx.translate(p.width,0);
      ctx.scale(-1,1);
      ctx.drawImage(camVideo,dx,dy,dw,dh);
    }else{
      ctx.drawImage(camVideo,dx,dy,dw,dh);
    }
    ctx.filter='none';
    ctx.restore();
  }

  function drawQuadFrame(p,q){
    const ctx=p.drawingContext;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.lineJoin='round';
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(q[0].x,q[0].y);
    ctx.lineTo(q[1].x,q[1].y);
    ctx.lineTo(q[2].x,q[2].y);
    ctx.lineTo(q[3].x,q[3].y);
    ctx.closePath();
    ctx.strokeStyle='rgba(0,180,255,.18)';
    ctx.lineWidth=18;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(q[0].x,q[0].y);
    ctx.lineTo(q[1].x,q[1].y);
    ctx.lineTo(q[2].x,q[2].y);
    ctx.lineTo(q[3].x,q[3].y);
    ctx.closePath();
    ctx.strokeStyle='rgba(0,120,255,.45)';
    ctx.lineWidth=8;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(q[0].x,q[0].y);
    ctx.lineTo(q[1].x,q[1].y);
    ctx.lineTo(q[2].x,q[2].y);
    ctx.lineTo(q[3].x,q[3].y);
    ctx.closePath();
    ctx.strokeStyle='rgba(20,220,255,1)';
    ctx.lineWidth=3;
    ctx.stroke();
    for(let i=0;i<4;i++){
      const x=q[i].x;
      const y=q[i].y;
      ctx.beginPath();
      ctx.arc(x,y,20,0,Math.PI*2);
      ctx.fillStyle='rgba(0,150,255,.18)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x,y,11,0,Math.PI*2);
      ctx.fillStyle='rgba(120,240,255,.8)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x,y,7,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,1)';
      ctx.fill();
    }
    ctx.restore();
  }

  function fingerUp(lm,tip,pip,wrist){
    wrist=wrist||0;
    const w=lm[wrist];
    const dTip=Math.hypot(lm[tip].x-w.x,lm[tip].y-w.y);
    const dPip=Math.hypot(lm[pip].x-w.x,lm[pip].y-w.y);
    return dTip>dPip*1.15;
  }

  function isMiddleFingerGesture(lm){
    const index=fingerUp(lm,8,6);
    const middle=fingerUp(lm,12,10);
    const ring=fingerUp(lm,16,14);
    const pinky=fingerUp(lm,20,18);
    return middle&&!index&&!ring&&!pinky;
  }

  function fireMiddleFingerBlast(p,lm,col){
    if(audioUnlocked){
      ye.currentTime=0;
      ye.play().catch(()=>{});
    }
    const pos=project(p,lm[12]);
    for(let i=0;i<60;i++){
      const ang=p.random(p.TWO_PI);
      const spd=p.random(2,40);
      parts.push({
        x:pos.x,
        y:pos.y,
        vx:Math.cos(ang)*spd,
        vy:Math.sin(ang)*spd,
        life:255,
        size:p.random(10,30),
        col:col
      });
    }
  }

  function project(p,pt){
    /*
    MediaPipeの座標は「元のカメラ映像」の座標。
    画面への表示はcoverなので、縦横比が違うと左右/上下が切り取られる。
    以前は単純に pt.x * canvas幅 / pt.y * canvas高さとしていたため、
    手の位置と映像上の位置にズレが出ていた。

    drawCam() / drawInvertedQuad() と全く同じ cover 計算を使うことで、
    ランドマークを「実際に表示されているカメラ映像」の座標へ変換する。
    */
    const vw=camVideo&&camVideo.videoWidth?camVideo.videoWidth:1;
    const vh=camVideo&&camVideo.videoHeight?camVideo.videoHeight:1;

    const s=Math.max(p.width/vw,p.height/vh);
    const dw=vw*s;
    const dh=vh*s;
    const dx=(p.width-dw)/2;
    const dy=(p.height-dh)/2;

    const videoX=dx+pt.x*dw;
    const videoY=dy+pt.y*dh;

    const x=MIRROR?p.width-videoX:videoX;
    const y=videoY;

    return{x:x,y:y};
  }

  function drawCam(p){
    if(!camVideo||camVideo.readyState<2)return;
    const vw=camVideo.videoWidth;
    const vh=camVideo.videoHeight;
    if(!vw||!vh)return;
    const s=Math.max(p.width/vw,p.height/vh);
    const dw=vw*s;
    const dh=vh*s;
    const dx=(p.width-dw)/2;
    const dy=(p.height-dh)/2;
    const ctx=p.drawingContext;
    ctx.save();
    ctx.globalAlpha=BG_ALPHA;
    if(MIRROR){
      ctx.translate(p.width,0);
      ctx.scale(-1,1);
    }
    ctx.drawImage(camVideo,dx,dy,dw,dh);
    ctx.restore();
  }

  function spawnParticles(p,pt,col,n){
    const pos=project(p,pt);
    for(let i=0;i<n;i++){
      if(parts.length>=MAX_PARTS)parts.shift();
      parts.push({
        x:pos.x+p.random(-4,4),
        y:pos.y+p.random(-4,4),
        vx:p.random(-.6,.6),
        vy:p.random(-1.3,-.3),
        life:255,
        size:p.random(6,22),
        col:col
      });
    }
  }

  function drawParticles(p){
    p.blendMode(p.ADD);
    p.noStroke();
    for(let i=parts.length-1;i>=0;i--){
      const pt=parts[i];
      pt.x+=pt.vx;
      pt.y+=pt.vy;
      pt.vy-=.01;
      pt.life-=LIFE_DECAY;
      pt.size*=SHRINK;
      if(pt.life<=0||pt.size<.5){
        parts.splice(i,1);
        continue;
      }
      const a=p.map(pt.life,0,255,0,180);
      const c=pt.col;
      p.fill(c[0],c[1],c[2],a*.25);
      p.circle(pt.x,pt.y,pt.size*2.4);
      p.fill(255,255,255,a*.5);
      p.circle(pt.x,pt.y,pt.size*.6);
      p.fill(c[0],c[1],c[2],a);
      p.circle(pt.x,pt.y,pt.size);
    }
    p.blendMode(p.BLEND);
  }

  function drawBones(p,lm,col){
    p.blendMode(p.ADD);
    p.stroke(col[0],col[1],col[2],60);
    p.strokeWeight(2);
    for(let i=0;i<BONES.length;i++){
      const a=project(p,lm[BONES[i][0]]);
      const b=project(p,lm[BONES[i][1]]);
      p.line(a.x,a.y,b.x,b.y);
    }
    p.blendMode(p.BLEND);
    p.noStroke();
  }
</script>
