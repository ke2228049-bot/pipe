<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Light</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100%;
    height: 100%;
  }
  video { display: none; }

  #modeSelectWrap {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 50;
  }

  #modeSelect {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 14px;
    color: #fff;
    background: rgba(20, 20, 20, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    padding: 8px 12px;
    outline: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  #modeSelect option {
    color: #000;
  }
</style>
</head>
<body>

<video id="cam" playsinline></video>

<div id="modeSelectWrap">
  <select id="modeSelect">
    <option value="A">モード A</option>
    <option value="B">モード B（全身）</option>
    <option value="C">モード C（準備中）</option>
  </select>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

<script>
var MAX_HANDS = 6;
var MAX_PARTS = 3000;
var MIRROR = true;
var CAM_BG = true;
var SKELETON = false;
var BG_ALPHA = 0.5;
var LIFE_DECAY = 14;
var SHRINK = 0.94;

var COLORS = [
  [80, 200, 255],
  [255, 110, 200],
  [255, 210, 60],
  [120, 255, 140],
  [190, 120, 255],
  [255, 140, 60]
];

var TIPS = [4, 8, 12, 16, 20];

// 骨格インデックスを修正（薬指の関節14-15を追加）
var BONES = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

let handData = null;
let camVideo;
let parts = [];
let gestureFlags = {};
let audioUnlocked = false;

const ye = new Audio('ye.mp3');

// ---- モード管理 ----
let currentMode = 'A';

// ---- モードB用（人が通った場所からドットが押し出されるエフェクト）----
const SAMPLE_COLS = 72;
const SAMPLE_ROWS = 48;
let sampleCanvas, sampleCtx;

let bBgAvg = null;      // 各セルの明るさのゆっくり追従する平均（背景）
let bOcc = null;        // 各セルの「人がいる度合い」0〜1
let bDots = null;       // 各セルに対応する点のオフセット・速度
let bInitialized = false;

const B_BG_RATE = 0.02;     // 背景が現在の映像に追従する速さ（小さいほど余韻が長い）
const B_DIFF_THRESH = 14;   // これ以上の差分から「人がいる」と判定し始める
const B_DIFF_RANGE = 60;    // この差分で占有度が最大(1.0)になる
const B_PUSH_GAIN = 2.4;    // 押し出す力の強さ
const B_SPRING = 0.06;      // 元の位置へ戻すばねの強さ
const B_DAMPING = 0.82;     // 速度の減衰（大きいほどよく揺れる）
const B_MAX_OFFSET = 46;    // 押し出される最大距離（px）

function initBState() {
  const n = SAMPLE_COLS * SAMPLE_ROWS;
  bBgAvg = new Float32Array(n);
  bOcc = new Float32Array(n);
  bDots = new Array(n);
  for (let k = 0; k < n; k++) bDots[k] = { ox: 0, oy: 0, vx: 0, vy: 0 };
  bInitialized = false;
}

function resetBState() {
  bInitialized = false;
  if (bDots) {
    for (let k = 0; k < bDots.length; k++) {
      bDots[k].ox = 0; bDots[k].oy = 0; bDots[k].vx = 0; bDots[k].vy = 0;
    }
  }
}

function setupModeSelect() {
  const sel = document.getElementById('modeSelect');
  sel.value = currentMode;
  sel.addEventListener('change', () => {
    currentMode = sel.value;
    // モード切替時にエフェクトの残留物をリセット
    parts = [];
    gestureFlags = {};
    resetBState();
  });
}

function onHandsResult(res) {
  handData = res;
}

async function initCamera() {
  camVideo = document.getElementById('cam');

  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });

  hands.setOptions({
    maxNumHands: MAX_HANDS,
    modelComplexity: 1,
    minDetectionConfidence: 0.4,
    minTrackingConfidence: 0.4
  });

  hands.onResults(onHandsResult);

  const cam = new Camera(camVideo, {
    onFrame: async () => { await hands.send({ image: camVideo }); },
    width: 1920,
    height: 1080
  });

  await cam.start();
}

const sketch = (p) => {

  p.setup = function () {
    const c = p.createCanvas(p.windowWidth, p.windowHeight);
    c.style('position', 'fixed');
    c.style('top', '0');
    c.style('left', '0');
    c.style('z-index', '1');
    p.pixelDensity(1);
    p.background(0);

    sampleCanvas = document.createElement('canvas');
    sampleCanvas.width = SAMPLE_COLS;
    sampleCanvas.height = SAMPLE_ROWS;
    sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

    initBState();
    setupModeSelect();
  };

  // 画面の初回クリック/タップでブラウザの音声自動再生ブロックを解除
  p.mousePressed = () => {
    if (!audioUnlocked) {
      ye.play().then(() => {
        ye.pause();
        ye.currentTime = 0;
        audioUnlocked = true;
      }).catch(() => {});
    }
  };

  p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);

  p.draw = () => {
    if (currentMode === 'C') {
      drawModeC(p);
      return;
    }
    if (currentMode === 'B') {
      drawModeB(p);
      return;
    }
    drawModeA(p);
  };
};

// =====================================================
// モード A：既存の手のひら・指先パーティクルエフェクト
// =====================================================
function drawModeA(p) {
  p.noStroke();
  p.fill(0, 0, 0, 255);
  p.rect(0, 0, p.width, p.height);

  if (CAM_BG) drawCam(p);

  if (handData && handData.multiHandLandmarks) {
    const list = handData.multiHandLandmarks;

    for (let h = 0; h < list.length; h++) {
      const lm = list[h];
      const col = COLORS[h % COLORS.length];

      let px = 0, py = 0;
      const palmIdx = [0, 5, 9, 13, 17];
      for (let k = 0; k < palmIdx.length; k++) {
        px += lm[palmIdx[k]].x;
        py += lm[palmIdx[k]].y;
      }
      px /= palmIdx.length;
      py /= palmIdx.length;
      spawnParticles(p, { x: px, y: py }, col, 2);

      for (let t = 0; t < TIPS.length; t++) {
        spawnParticles(p, lm[TIPS[t]], col, 3);
      }

      if (SKELETON) drawBones(p, lm, col);

      const middleUp = isMiddleFingerGesture(lm);
      if (middleUp && !gestureFlags[h]) {
        fireMiddleFingerBlast(p, lm, col);
      }
      gestureFlags[h] = middleUp;
    }
  }

  drawParticles(p);
}

// =====================================================
// モード B：格子状のドットが「人が通った場所」から押し出されるエフェクト
// =====================================================
function drawModeB(p) {
  p.noStroke();
  p.fill(0, 0, 0, 255);
  p.rect(0, 0, p.width, p.height);

  if (!camVideo || camVideo.readyState < 2 || !camVideo.videoWidth) return;

  // 低解像度キャンバスに映像を焼き込み、各セルの色と明るさを取得する
  sampleCtx.save();
  if (MIRROR) {
    sampleCtx.translate(SAMPLE_COLS, 0);
    sampleCtx.scale(-1, 1);
  }
  try {
    sampleCtx.drawImage(camVideo, 0, 0, SAMPLE_COLS, SAMPLE_ROWS);
  } catch (e) {
    sampleCtx.restore();
    return;
  }
  sampleCtx.restore();

  let data;
  try {
    data = sampleCtx.getImageData(0, 0, SAMPLE_COLS, SAMPLE_ROWS).data;
  } catch (e) {
    return;
  }

  const cols = SAMPLE_COLS, rows = SAMPLE_ROWS;
  const cellW = p.width / cols;
  const cellH = p.height / rows;

  // 1) ゆっくり追従する「背景の明るさ」との差分から、各セルの占有度（人がいる度合い）を更新
  for (let idx = 0, j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++, idx++) {
      const o = idx * 4;
      const lum = (data[o] + data[o + 1] + data[o + 2]) / 3;

      if (!bInitialized) {
        bBgAvg[idx] = lum;
      } else {
        bBgAvg[idx] += (lum - bBgAvg[idx]) * B_BG_RATE;
      }

      const diff = Math.abs(lum - bBgAvg[idx]);
      let occ = (diff - B_DIFF_THRESH) / B_DIFF_RANGE;
      if (occ < 0) occ = 0;
      if (occ > 1) occ = 1;
      bOcc[idx] = occ;
    }
  }
  bInitialized = true;

  // 2) 占有度の勾配から「押し出す力」を計算し、各点をばね物理で更新
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const idx = j * cols + i;
      const dot = bDots[idx];

      let fx = 0, fy = 0;
      if (i > 0 && i < cols - 1) {
        fx = -(bOcc[idx + 1] - bOcc[idx - 1]) * 0.5;
      }
      if (j > 0 && j < rows - 1) {
        fy = -(bOcc[idx + cols] - bOcc[idx - cols]) * 0.5;
      }
      const occHere = bOcc[idx];
      const push = B_PUSH_GAIN * (0.3 + occHere);

      dot.vx += fx * push * cellW;
      dot.vy += fy * push * cellH;

      // 元の格子位置へ戻すばね
      dot.vx += -dot.ox * B_SPRING;
      dot.vy += -dot.oy * B_SPRING;

      dot.vx *= B_DAMPING;
      dot.vy *= B_DAMPING;

      dot.ox += dot.vx;
      dot.oy += dot.vy;

      if (dot.ox > B_MAX_OFFSET) dot.ox = B_MAX_OFFSET;
      if (dot.ox < -B_MAX_OFFSET) dot.ox = -B_MAX_OFFSET;
      if (dot.oy > B_MAX_OFFSET) dot.oy = B_MAX_OFFSET;
      if (dot.oy < -B_MAX_OFFSET) dot.oy = -B_MAX_OFFSET;
    }
  }

  // 3) 押し出された位置に、映像の色を乗せた点を描画
  p.noStroke();
  const baseR = Math.max(cellW, cellH) * 0.95;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const idx = j * cols + i;
      const o = idx * 4;
      const r = data[o], g = data[o + 1], b = data[o + 2];
      const dot = bDots[idx];

      const hx = i * cellW + cellW / 2;
      const hy = j * cellH + cellH / 2;
      const x = hx + dot.ox;
      const y = hy + dot.oy;

      const occHere = bOcc[idx];
      const rad = baseR * (0.7 + occHere * 0.5);

      p.fill(r, g, b, 235);
      p.circle(x, y, rad);
    }
  }
}

// =====================================================
// モード C：保留（プレースホルダー）
// =====================================================
function drawModeC(p) {
  p.noStroke();
  p.fill(0, 0, 0, 255);
  p.rect(0, 0, p.width, p.height);

  p.fill(255, 255, 255, 180);
  p.textAlign(p.CENTER, p.CENTER);
  p.textSize(Math.max(16, p.width * 0.02));
  p.text('モード C は準備中です', p.width / 2, p.height / 2);
}

// =====================================================
// 共通ユーティリティ（モード A / 手検出関連）
// =====================================================
function fingerUp(lm, tip, pip, wrist) {
  wrist = wrist || 0;
  const w = lm[wrist];
  const dTip = Math.hypot(lm[tip].x - w.x, lm[tip].y - w.y);
  const dPip = Math.hypot(lm[pip].x - w.x, lm[pip].y - w.y);
  return dTip > dPip * 1.15;
}

function isMiddleFingerGesture(lm) {
  const index = fingerUp(lm, 8, 6);
  const middle = fingerUp(lm, 12, 10);
  const ring = fingerUp(lm, 16, 14);
  const pinky = fingerUp(lm, 20, 18);
  return middle && !index && !ring && !pinky;
}

function fireMiddleFingerBlast(p, lm, col) {
  if (audioUnlocked) {
    ye.currentTime = 0;
    ye.play().catch(() => {});
  }
  const pos = project(p, lm[12]);
  for (let i = 0; i < 60; i++) {
    const ang = p.random(p.TWO_PI);
    const spd = p.random(2, 40); // 変数の再宣言エラーを解消
    parts.push({
      x: pos.x,
      y: pos.y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 255,
      size: p.random(10, 30),
      col: col
    });
  }
}

function project(p, pt) {
  const x = MIRROR ? (1 - pt.x) * p.width : pt.x * p.width;
  const y = pt.y * p.height;
  return { x: x, y: y };
}

function drawCam(p) {
  if (!camVideo || camVideo.readyState < 2) return;
  const vw = camVideo.videoWidth;
  const vh = camVideo.videoHeight;
  if (!vw || !vh) return;

  const s = Math.max(p.width / vw, p.height / vh);
  const dw = vw * s;
  const dh = vh * s;
  const dx = (p.width - dw) / 2;
  const dy = (p.height - dh) / 2;

  const ctx = p.drawingContext;
  ctx.save();
  ctx.globalAlpha = BG_ALPHA;
  if (MIRROR) {
    ctx.translate(p.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(camVideo, dx, dy, dw, dh);
  ctx.restore();
}

function spawnParticles(p, pt, col, n) {
  const pos = project(p, pt);
  for (let i = 0; i < n; i++) {
    if (parts.length >= MAX_PARTS) parts.shift();
    parts.push({
      x: pos.x + p.random(-4, 4),
      y: pos.y + p.random(-4, 4),
      vx: p.random(-0.6, 0.6),
      vy: p.random(-1.3, -0.3),
      life: 255,
      size: p.random(6, 22),
      col: col
    });
  }
}

function drawParticles(p) {
  p.blendMode(p.ADD);
  p.noStroke();

  for (let i = parts.length - 1; i >= 0; i--) {
    const pt = parts[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy -= 0.01;
    pt.life -= LIFE_DECAY;
    pt.size *= SHRINK;

    if (pt.life <= 0 || pt.size < 0.5) {
      parts.splice(i, 1);
      continue;
    }

    const a = p.map(pt.life, 0, 255, 0, 180);
    const c = pt.col;

    p.fill(c[0], c[1], c[2], a * 0.25);
    p.circle(pt.x, pt.y, pt.size * 2.4);
    p.fill(255, 255, 255, a * 0.5);
    p.circle(pt.x, pt.y, pt.size * 0.6);
    p.fill(c[0], c[1], c[2], a);
    p.circle(pt.x, pt.y, pt.size);
  }

  p.blendMode(p.BLEND);
}

function drawBones(p, lm, col) {
  p.blendMode(p.ADD);
  p.stroke(col[0], col[1], col[2], 60);
  p.strokeWeight(2);
  for (let i = 0; i < BONES.length; i++) {
    const a = project(p, lm[BONES[i][0]]);
    const b = project(p, lm[BONES[i][1]]);
    p.line(a.x, a.y, b.x, b.y);
  }
  p.blendMode(p.BLEND);
  p.noStroke();
}

new p5(sketch);
initCamera();
</script>
</body>
</html>
